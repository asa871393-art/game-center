name: Deploy

# Every push to main runs the CI checks, then (if they pass) deploys the Firestore security rules
# and indexes to the Firebase project. Can also be started by hand: Actions tab → Deploy → Run workflow.
#
# Repository secret (Settings → Secrets and variables → Actions → New repository secret):
#   FIREBASE_SERVICE_ACCOUNT  the whole JSON file from Firebase console → Project settings →
#                             Service accounts → Generate new private key
# Without it the deploy step is skipped with a warning instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  firestore:
    name: Deploy Firestore rules and indexes
    needs: checks
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Firebase secret
        id: secret
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set; skipping the Firestore rules/indexes deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.secret.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Deploy rules and indexes
        if: steps.secret.outputs.present == 'true'
        run: |
          npm ci --no-audit --no-fund
          key="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          project="$(node -e "process.stdout.write(require(process.argv[1]).project_id)" "$key")"
          GOOGLE_APPLICATION_CREDENTIALS="$key" npx firebase deploy \
            --only firestore:rules,firestore:indexes --project "$project" --non-interactive
          rm -f "$key"

