services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gaming
      POSTGRES_PASSWORD: gaming
      POSTGRES_DB: gaming_lounge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaming -d gaming_lounge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
