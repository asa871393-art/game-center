# Firebase App Hosting settings (https://firebase.google.com/docs/app-hosting/configure).
# App Hosting builds and deploys main from GitHub on every push. Firestore access needs no key here:
# the backend's own service account is used (see firebaseManagedConfig in src/lib/env.ts).

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Secrets live in Cloud Secret Manager. Create each one once (App Hosting → the backend → Settings →
  # Environment, or `npx firebase apphosting:secrets:set NAME`) before the first rollout.
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
  - variable: POS_TERMINAL_CODE
    secret: POS_TERMINAL_CODE
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
  # After the first rollout, set the backend URL (or your domain) here; ZainCash needs it for its callback.
  # - variable: NEXT_PUBLIC_APP_URL
  #   value: https://<backend>--<project>.<region>.hosted.app
  # ZainCash (optional):
  # - variable: ZAINCASH_CLIENT_ID
  #   secret: ZAINCASH_CLIENT_ID
  # - variable: ZAINCASH_CLIENT_SECRET
  #   secret: ZAINCASH_CLIENT_SECRET
  # - variable: ZAINCASH_ENV
  #   value: live
